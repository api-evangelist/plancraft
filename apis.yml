name: plancraft
description: >-
  plancraft is a German cloud-based business management software for craftspeople and
  trades businesses (Handwerk). It digitizes administrative workflows end to end —
  quote and estimate creation, project planning, time tracking, on-site documentation,
  material and labor costing, and invoicing — inside one integrated platform aimed at
  small and mid-sized construction and trade companies. plancraft supports DATEV export
  for tax/accounting workflows and DATANORM and GAEB catalog imports for material data
  and tender processing. It is a venture-backed SaaS company (portfolio company of
  Creandum). As of this enrichment pass plancraft publishes no public developer API,
  SDK, or OpenAPI surface — integrations are delivered as prebuilt connectors and
  standardized file-format import/export.
